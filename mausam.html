<style>
@property --a{syntax:'<color>';inherits:true;initial-value:#0d3b66}
@property --b{syntax:'<color>';inherits:true;initial-value:#1b8fc4}
@property --c{syntax:'<color>';inherits:true;initial-value:#8fd3e8}
:root{--ink:#f7fbff;--soft:rgba(255,255,255,.1);--glass:rgba(255,255,255,.1);--line:rgba(255,255,255,.18);--pill:rgba(255,255,255,.24);--glow:rgba(255,226,150,.38);--cl:.5;--ray:0;--fog:0;--ease:cubic-bezier(.2,.8,.2,1)}
[data-t=sun]{--a:#0d3b66;--b:#1b8fc4;--c:#8fd3e8;--cl:.35;--ray:.2}
[data-t=night]{--a:#060b20;--b:#16244a;--c:#34457a;--glow:rgba(190,210,255,.16);--cl:.12}

[data-t=cloudn]{--a:#101828;--b:#2a3a54;--c:#4a5c78;--glow:rgba(180,200,255,.08);--cl:.7}
[data-t=rain]{--a:#0e1c2f;--b:#27536a;--c:#4f7d8c;--glow:rgba(150,210,255,.12);--cl:.9;--fog:.35}
[data-t=storm]{--a:#090919;--b:#2b2a4d;--c:#4d4670;--glow:rgba(190,170,255,.12);--cl:1;--fog:.3}
[data-t=snow]{--a:#58769a;--b:#9fbdd6;--c:#e6f1f8;--glow:rgba(255,255,255,.35);--ink:#0f2236;--soft:rgba(15,34,54,.09);--glass:rgba(255,255,255,.42);--line:rgba(255,255,255,.55);--pill:rgba(255,255,255,.8);--cl:.6}
[data-t=fog]{--a:#566573;--b:#8d9ba6;--c:#c8d0d5;--glow:rgba(255,255,255,.25);--ink:#0f2236;--soft:rgba(15,34,54,.09);--glass:rgba(255,255,255,.4);--line:rgba(255,255,255,.55);--pill:rgba(255,255,255,.8);--cl:.8;--fog:1}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(150deg,var(--a),var(--b) 55%,var(--c)) fixed;transition:--a 1.6s,--b 1.6s,--c 1.6s,color .6s;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(255,255,255,.3)}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--soft);border-radius:9px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#6ccbff,#ffd36a,#ff8a5c);z-index:30;border-radius:0 3px 3px 0}
.fx{position:fixed;pointer-events:none}
.bl{width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.32;animation:blob 26s ease-in-out infinite alternate}
.bl:nth-child(1){left:-18vmax;top:-12vmax;background:var(--c)}.bl:nth-child(2){right:-20vmax;top:25vh;background:var(--b);animation-delay:-9s;animation-duration:32s}.bl:nth-child(3){left:15vw;bottom:-28vmax;background:var(--c);animation-delay:-16s}
@keyframes blob{to{transform:translate(9vmax,6vmax) scale(1.18)}}
.glowball{right:-120px;top:-80px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);animation:pulse 7s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.1)}}
.rays{right:-26vmax;top:-26vmax;width:72vmax;height:72vmax;opacity:var(--ray);transition:opacity 1.6s;background:repeating-conic-gradient(from 0deg,rgba(255,238,175,.55) 0 3deg,transparent 3deg 13deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 140s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.fog{inset:-10%;opacity:var(--fog);transition:opacity 1.6s;filter:blur(34px);background:radial-gradient(55% 28% at 20% 72%,rgba(255,255,255,.4),transparent),radial-gradient(60% 34% at 82% 38%,rgba(255,255,255,.3),transparent);animation:fogm 34s ease-in-out infinite alternate}@keyframes fogm{to{transform:translateX(9%) scale(1.15)}}
.clouds{inset:0;overflow:hidden;opacity:var(--cl);transition:opacity 1.6s}
.cl{position:absolute;left:-260px;width:220px;height:66px;border-radius:99px;background:rgba(255,255,255,.13);filter:blur(2px);animation:dr 60s linear infinite}
.cl:before,.cl:after{content:"";position:absolute;border-radius:50%;background:inherit}.cl:before{width:96px;height:96px;left:34px;top:-46px}.cl:after{width:126px;height:126px;left:86px;top:-62px}
.cl:nth-child(1){top:14%}.cl:nth-child(2){top:44%;transform:scale(.7);animation-duration:85s;animation-delay:-30s}.cl:nth-child(3){top:70%;transform:scale(1.1);animation-duration:70s;animation-delay:-48s}
@keyframes dr{to{left:110%}}
#fx{inset:0}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.shell{position:relative;width:min(1120px,calc(100% - 28px));margin:auto;padding:14px 0 44px}
.glass{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 18px 50px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.12)}
.glass:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 45%)}.glass:hover:after{opacity:1}
.rv{opacity:0;transform:translateY(28px) scale(.985);transition:opacity .9s var(--ease),transform .9s var(--ease)}.rv.in{opacity:1;transform:none}
.glass.rv.in:hover{transform:translateY(-3px)}
.top{position:sticky;top:10px;z-index:8;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:22px;border:1px solid transparent;transition:background .4s,border-color .4s,box-shadow .4s,backdrop-filter .4s}
.top.sc{background:var(--glass);border-color:var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 10px 40px rgba(0,0,0,.12)}
.brand{font-weight:800;letter-spacing:4px;font-size:15px;display:flex;align-items:center;gap:11px}.brand .mk{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--soft);border:1px solid var(--line);box-shadow:0 0 22px rgba(255,200,80,.25)}.mk svg{overflow:visible;filter:drop-shadow(0 0 6px rgba(255,200,80,.6))}.r8{transform-origin:24px 24px;animation:spin 22s linear infinite}.core{transform-origin:24px 24px;animation:pulse 4s ease-in-out infinite}@keyframes tw{50%{transform:rotate(18deg) scale(1.08)}}
.brand small{display:block;letter-spacing:0;font-weight:400;font-size:11px;opacity:.65;margin-top:2px}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:9px 15px;font-size:13px;backdrop-filter:blur(12px);transition:transform .25s var(--ease),background .25s,box-shadow .25s}.btn:hover{transform:translateY(-2px);background:var(--glass);box-shadow:0 8px 20px rgba(0,0,0,.14)}.btn:active{transform:scale(.95)}
.search{position:relative;width:min(580px,100%);margin:20px auto 0;z-index:7}
.search input{width:100%;padding:15px 52px 15px 20px;border-radius:18px;border:1px solid var(--line);background:var(--glass);outline:0;backdrop-filter:blur(16px);transition:box-shadow .3s,transform .3s var(--ease)}.search input:focus{box-shadow:0 0 0 4px rgba(255,255,255,.25),0 14px 40px rgba(0,0,0,.15);transform:scale(1.015)}.search input::placeholder{color:inherit;opacity:.6}
.search kbd{position:absolute;right:16px;top:14px;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;opacity:.6}
.drop{position:absolute;left:0;right:0;top:58px;border-radius:18px;overflow:hidden;background:rgba(10,25,45,.94);color:#fff;display:none;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:dd .25s var(--ease)}@keyframes dd{from{opacity:0;transform:translateY(-8px)}}.drop div{padding:12px 16px;cursor:pointer;font-size:14px;transition:background .15s}.drop div:hover{background:rgba(255,255,255,.14)}.drop small{opacity:.6}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 0}.chip{padding:6px 13px;font-size:12px;animation:up .6s var(--ease) both}
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;padding:26px 6px 18px}
.loc{display:flex;align-items:center;gap:8px;font-size:clamp(24px,3.2vw,34px);font-weight:650;letter-spacing:-.3px}.star{background:none;border:0;font-size:24px;transition:transform .3s var(--ease)}.star:hover{transform:scale(1.25) rotate(14deg)}.star.pop{animation:starpop .5s var(--ease)}@keyframes starpop{40%{transform:scale(1.7) rotate(-20deg)}}
.sub{opacity:.72;font-size:13px;margin-top:5px;font-variant-numeric:tabular-nums}
.temp{font-size:clamp(100px,17vw,170px);font-weight:200;letter-spacing:-8px;line-height:1.03;margin-top:6px;font-variant-numeric:tabular-nums}.temp sup{font-size:.26em;letter-spacing:0;font-weight:300;vertical-align:top;position:relative;top:.6em;opacity:.8}
@supports (background-clip:text) and (color:color-mix(in srgb,red,blue)){#temp{background:linear-gradient(180deg,var(--ink) 25%,color-mix(in srgb,var(--ink) 50%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}}
.cond{font-size:22px;font-weight:500}.meta{opacity:.75;font-size:14px;margin-top:6px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.bd{padding:8px 13px;border-radius:13px;background:var(--soft);font-size:12.5px;border:1px solid transparent;transition:.25s;animation:up .6s var(--ease) both}.bd:hover{border-color:var(--line);transform:translateY(-2px)}.bd:nth-child(2){animation-delay:.08s}.bd:nth-child(3){animation-delay:.16s}.bd:nth-child(4){animation-delay:.24s}
.ew{position:relative;display:grid;place-items:center;min-width:min(320px,60vw);min-height:270px;transform:translate(calc(var(--px,0)*-24px),calc(var(--py,0)*-18px));transition:transform .3s ease-out}
.emoji{font-size:clamp(110px,18vw,180px);animation:fl 5.5s ease-in-out infinite;filter:drop-shadow(0 26px 30px rgba(0,0,0,.25));user-select:none;position:relative;z-index:1}@keyframes fl{50%{transform:translateY(-14px) rotate(2.5deg)}}
.orbit{position:absolute;width:250px;height:250px;border-radius:50%;border:1px solid var(--line);box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 62px rgba(255,255,255,.025);animation:spin 30s linear infinite}.orbit:after{content:"";position:absolute;top:22px;right:34px;width:9px;height:9px;border-radius:50%;background:#d7f6ff;box-shadow:0 0 16px #d7f6ff}
.alerts{display:grid;gap:8px;margin-bottom:16px}.al{padding:13px 18px;font-size:14px;display:flex;gap:10px;align-items:center;animation:up .7s var(--ease) both}.al:nth-child(2){animation-delay:.1s}.al:nth-child(3){animation-delay:.2s}.al.warn{border-color:rgba(255,190,90,.7);background:rgba(255,170,60,.2)}.al.warn span:first-child{animation:tw 2.4s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.sec{padding:20px 22px;margin-bottom:16px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.sec h2{margin:0;font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.65;font-weight:700}
.tabs{display:flex;gap:4px;padding:3px;border-radius:99px;background:var(--soft);position:relative}.tab{position:relative;z-index:1;border:0;background:none;padding:6px 14px;border-radius:99px;font-size:12px;transition:opacity .2s,font-weight .2s;opacity:.7}.tab.on{opacity:1;font-weight:700}
.pill{position:absolute;top:3px;bottom:3px;left:0;border-radius:99px;background:var(--pill);box-shadow:0 2px 12px rgba(0,0,0,.14);transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s var(--ease)}
.chart{overflow-x:auto;padding-bottom:4px}.chart svg{display:block;color:var(--ink)}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(0);opacity:0}}@keyframes grow{from{transform:scaleY(0)}}@keyframes gx{from{transform:scaleX(0)}}@keyframes gl{from{left:0}}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.three .sec,.cols .sec{margin-bottom:0}.cols,.three{margin-bottom:16px}
.day{display:grid;grid-template-columns:58px 28px 38px 1fr 78px;gap:8px;align-items:center;padding:11px 8px;margin:0 -8px;border-radius:14px;font-size:13px;transition:background .25s}.day:hover{background:var(--soft)}
.day .pp{color:#8fd6ff;font-size:11px;text-align:center}[data-t=snow] .day .pp,[data-t=fog] .day .pp{color:#14609a}.track{height:6px;border-radius:9px;background:var(--soft);position:relative}.track i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#6ccbff,#ffd36a,#ff8a5c);transform-origin:left;animation:gx 1s var(--d,0ms) var(--ease) both}.rng{text-align:right}.rng span{opacity:.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.m{padding:14px;border-radius:18px;background:var(--soft);border:1px solid transparent;transition:transform .3s var(--ease),border-color .3s,background .3s}.m:hover{transform:translateY(-4px);border-color:var(--line);background:var(--glass)}.m small{font-size:11px;opacity:.72}.m b{display:block;font-size:22px;margin:7px 0 2px;font-weight:600}.m em{font-size:11px;opacity:.62;font-style:normal}
.big{font-size:54px;font-weight:300;line-height:1}.moon{animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,255,220,.35))}.cen{text-align:center}.gauge{height:8px;border-radius:9px;margin:16px 0 8px;position:relative;background:linear-gradient(90deg,#3ddc84,#ffd93d 17%,#ff9f43 33%,#ff5c5c 50%,#a45cff 67%,#7b1e3a)}.gauge i{position:absolute;top:-4px;width:6px;height:16px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);transform:translateX(-50%);animation:gl 1.4s var(--ease) both}
.pl{display:flex;justify-content:space-between;font-size:11px;opacity:.75;margin-top:10px;gap:6px;flex-wrap:wrap}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.tip{padding:15px;border-radius:18px;background:var(--soft);font-size:14px;line-height:1.55;transition:transform .3s var(--ease);animation:up .6s var(--ease) both}.tip:hover{transform:translateY(-4px)}.tip b{display:block;margin-bottom:3px}
.radar{width:100%;height:400px;border:0;border-radius:18px;background:var(--soft)}
.foot{text-align:center;font-size:11px;opacity:.6;margin-top:8px;line-height:1.7}
.load{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:14px;background:rgba(5,15,30,.5);backdrop-filter:blur(8px);color:#fff;z-index:40;font-size:14px;letter-spacing:1px;transition:opacity .6s,visibility .6s}.load.off{opacity:0;visibility:hidden}.spin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .9s linear infinite}
@media(max-width:820px){.hero{grid-template-columns:1fr;text-align:center}.ew{grid-row:1;min-height:210px}.orbit{width:180px;height:180px}.loc,.badges{justify-content:center}.cols,.three{grid-template-columns:1fr}.btn.hide{display:none}.radar{height:320px}.search kbd{display:none}.brand small{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.rv{opacity:1!important;transform:none!important}}
</style>
</head>
<body data-t="sun">
<div id="bar"></div>
<div class="fx bl"></div><div class="fx bl"></div><div class="fx bl"></div>
<div class="fx glowball"></div><div class="fx rays"></div><div class="fx fog"></div>
<div class="fx clouds"><div class="cl"></div><div class="cl"></div><div class="cl"></div></div>
<canvas id="fx" class="fx"></canvas>
<div class="load" id="load"><div class="spin"></div>Reading the sky…</div>
<div class="shell">
  <div class="top" id="top">
    <div class="brand"><span class="mk"><svg viewBox="0 0 48 48" width="30" height="30" aria-label="Mausam sun logo"><defs><radialGradient id="sg" cx=".38" cy=".33"><stop offset="0" stop-color="#fff6c2"/><stop offset=".55" stop-color="#ffc83d"/><stop offset="1" stop-color="#ff9a3c"/></radialGradient></defs><g class="r8" stroke="#ffd36a" stroke-width="3.2" stroke-linecap="round" fill="none"><path d="M24 10V4M33.9 14.1l4.2-4.2M38 24h6M33.9 33.9l4.2 4.2M24 38v6M14.1 33.9l-4.2 4.2M10 24H4M14.1 14.1L9.9 9.9"/></g><circle class="core" cx="24" cy="24" r="9" fill="url(#sg)"/></svg></span><div>MAUSAM<small>Live weather, in motion</small></div></div>
    <div><button class="btn" id="unit">°C</button> <button class="btn" id="geo">⌖ My location</button> <button class="btn hide" id="refresh">↻ Refresh</button></div>
  </div>

</div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let unit=ls('unit','c'),favs=ls('favs',[{n:'Delhi',lat:28.65,lon:77.23},{n:'Mumbai',lat:19.07,lon:72.88},{n:'London',lat:51.51,lon:-0.13},{n:'Tokyo',lat:35.69,lon:139.69},{n:'New York',lat:40.71,lon:-74}]),place=ls('place',favs[0]),metric='temp',ov='radar',cur=null,shown=0,off=0,lastEmoji='';
const T=n=>unit==='f'?Math.round(n*9/5+32):Math.round(n),W=n=>unit==='f'?Math.round(n*.621)+' mph':Math.round(n)+' km/h',U=()=>unit==='f'?'°F':'°C';
const hr=t=>{const h=new Date(t).getHours();return (h%12||12)+(h<12?'a':'p')};

function info(c,d){
  if(c===0)return d?['Clear sky','☀️','sun']:['Clear night','🌙','night'];
  if(c<=2)return ['Partly cloudy',d?'⛅':'☁️',d?'sun':'night'];

  if(mode==='night'&&!still){if(!star&&Math.random()<.003)star={x:Math.random()*cv.width*.7,y:Math.random()*cv.height*.35,l:0};if(star){const g=cx.createLinearGradient(star.x,star.y,star.x-70,star.y-32);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(star.x,star.y);cx.lineTo(star.x-70,star.y-32);cx.stroke();star.x+=11;star.y+=5;if(++star.l>50)star=null}}
  if(mode==='storm'&&!still){if(Math.random()<.004){flash=1;bolt=mkBolt()}if(flash>.02){cx.fillStyle=`rgba(255,255,255,${flash*.18})`;cx.fillRect(0,0,cv.width,cv.height);if(bolt){cx.strokeStyle=`rgba(255,255,255,${flash})`;cx.lineWidth=2.2;cx.shadowBlur=24;cx.shadowColor='#b9a4ff';cx.beginPath();bolt.forEach(([x,y],k)=>k?cx.lineTo(x,y):cx.moveTo(x,y));cx.stroke();cx.shadowBlur=0}flash*=.9}}
  requestAnimationFrame(loop)})(0);

$('#unit').textContent=U();chips();load(place);setInterval(()=>load(place,true),600000);
